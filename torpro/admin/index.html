<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>TorPro Admin – Mitarbeiterbereich</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin">

<!-- ===== Login ===== -->
<div id="login" class="login-screen" hidden>
  <div class="login-card">
    <div class="login-logo"><span data-logo></span></div>
    <h2>Mitarbeiter-Login</h2>
    <p class="hint">Zugang nur für Monteure und Büro von TorPro.</p>
    <form id="login-form">
      <div class="field"><label for="l-email">E-Mail</label><input id="l-email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="l-pass">Passwort</label><input id="l-pass" type="password" autocomplete="current-password" required></div>
      <div id="login-msg"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" type="submit">Anmelden</button>
    </form>
    <p class="hint" id="login-mode" style="margin-top:1rem"></p>
    <p class="hint"><a href="../">← Zur Website</a></p>
  </div>
</div>

<!-- ===== App ===== -->
<div id="app" class="app" hidden>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#dashboard"><span data-logo="mark"></span></a>
    <nav>
      <a href="#dashboard" data-view="dashboard"><span>📊</span> Dashboard</a>
      <a href="#kalender" data-view="kalender"><span>📅</span> Kalender</a>
      <a href="#karte" data-view="karte"><span>🗺️</span> Karte</a>
      <a href="#auftraege" data-view="auftraege"><span>📋</span> Aufträge</a>
      <a href="#anfragen" data-view="anfragen"><span>📨</span> Anfragen <b class="badge" id="badge-req" hidden></b></a>
      <a href="#kunden" data-view="kunden"><span>👥</span> Kunden</a>
      <a href="#team" data-view="team"><span>🧑‍🔧</span> Team</a>
      <a href="#einstellungen" data-view="einstellungen"><span>⚙️</span> Einstellungen</a>
    </nav>
    <div class="sidebar-foot">
      <div class="user"><b id="user-name"></b><small id="user-email"></small></div>
      <button class="btn btn-ghost btn-sm" id="logout">Abmelden</button>
      <a class="hint" href="../" style="display:block;margin-top:.6rem">← Website</a>
    </div>
  </aside>
  <div class="main">
    <header class="app-top">
      <button class="nav-toggle" id="side-toggle" aria-label="Menü">☰</button>
      <h1 id="view-title">Dashboard</h1>
      <div class="top-actions" id="top-actions"></div>
      <span class="mode-pill" id="mode-pill"></span>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>

<div class="modal-back" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><h3 id="modal-title"></h3><button class="modal-close" id="modal-close" aria-label="Schließen">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/logo.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
