name: Netlify API call (token)

on:
  workflow_dispatch:
    inputs:
      token:
        description: "Netlify personal access token"
        required: true
        type: string
      calls:
        description: "One call per line: METHOD PATH [JSON body]"
        required: true
        type: string

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call Netlify API
        env:
          TOKEN: ${{ inputs.token }}
          CALLS: ${{ inputs.calls }}
        run: |
          echo "::add-mask::$TOKEN"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            m=$(echo "$line" | awk '{print $1}'); p=$(echo "$line" | awk '{print $2}'); b=$(echo "$line" | cut -d' ' -f3-)
            echo "=================== $m $p"
            if [ -n "$b" ] && [ "$b" != "$line" ] && [ "$b" != "$p" ]; then
              curl -sS -w '\nHTTP %{http_code}\n' -X "$m" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$b" "https://api.netlify.com$p" | head -c 6000
            else
              curl -sS -w '\nHTTP %{http_code}\n' -X "$m" -H "Authorization: Bearer $TOKEN" "https://api.netlify.com$p" | head -c 6000
            fi
            echo
          done <<< "$CALLS"
