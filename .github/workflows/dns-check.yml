name: DNS check

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain to check"
        required: true
        default: "torpro-zugangstechnik.de"
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query DNS from several resolvers
        env:
          D: ${{ inputs.domain }}
        run: |
          for r in 8.8.8.8 1.1.1.1 9.9.9.9; do
            echo "== $r A";    dig +short A "$D" @$r || true
            echo "== $r www";  dig +short CNAME "www.$D" @$r || true
            echo "== $r NS";   dig +short NS "$D" @$r || true
          done
          echo "== TLD delegation (a.nic.de)"; dig +norecurse NS "$D" @a.nic.de | sed -n '/AUTHORITY SECTION/,/^$/p' || true
          echo "== Authoritative ns1105.ui-dns.com"; dig +short A "$D" @ns1105.ui-dns.com || true; dig +short CNAME "www.$D" @ns1105.ui-dns.com || true
          echo "== HTTP"; curl -sS -o /dev/null -w 'http://%{url_effective} -> %{http_code} (%{redirect_url})\n' "http://$D/" || true
          curl -sS -o /dev/null -w 'https -> %{http_code}\n' "https://$D/" || true
