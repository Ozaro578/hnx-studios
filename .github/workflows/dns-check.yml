name: DNS check

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain to check"
        required: true
        default: "torpro-zugangstechnik.de"
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query DNS from several resolvers
        env:
          D: ${{ inputs.domain }}
        run: |
          sudo apt-get install -y -qq whois >/dev/null 2>&1 || true
          echo "== 8.8.8.8 A";    dig +short A "$D" @8.8.8.8 || true
          echo "== TLD delegation (a.nic.de)"; dig +norecurse NS "$D" @a.nic.de | sed -n '/AUTHORITY SECTION/,/^$/p' || true
          for ns in ns1025.ui-dns.de ns1034.ui-dns.biz ns1098.ui-dns.org ns1105.ui-dns.com; do
            echo "== $ns"; dig +norecurse +noall +answer +authority SOA "$D" @$ns || true; dig +short NS "$D" @$ns | sort | tr '\n' ' ' ; echo; dig +short A "$D" @$ns || true
          done
          echo "== DENIC whois"; whois -h whois.denic.de -- "-T dn $D" 2>&1 | grep -v '^%' | grep -v '^$' | head -20 || true
          echo "== HTTP"; curl -sS -o /dev/null -w 'http -> %{http_code}\n' "http://$D/" || true
