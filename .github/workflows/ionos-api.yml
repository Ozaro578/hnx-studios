name: IONOS API call

on:
  workflow_dispatch:
    inputs:
      api_key:
        description: "IONOS API key (prefix.secret)"
        required: true
        type: string
      calls:
        description: "One call per line: METHOD PATH-or-URL [JSON body]  |  GREP URL regex"
        required: true
        type: string

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call IONOS API
        env:
          KEY: ${{ inputs.api_key }}
          CALLS: ${{ inputs.calls }}
        run: |
          echo "::add-mask::$KEY"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            m=$(echo "$line" | awk '{print $1}'); p=$(echo "$line" | awk '{print $2}'); b=$(echo "$line" | cut -d' ' -f3-)
            case "$p" in http*) url="$p";; *) url="https://api.hosting.ionos.com$p";; esac
            echo "=================== $m $url"
            if [ "$m" = "GREP" ]; then
              curl -sSL "$url" | grep -oE "$b" | sort -u | head -80
            elif [ -n "$b" ] && [ "$b" != "$line" ] && [ "$b" != "$p" ]; then
              curl -sS -w '\nHTTP %{http_code}\n' -X "$m" -H "X-API-Key: $KEY" -H "Accept: application/json" -H "Content-Type: application/json" -d "$b" "$url" | head -c 8000
            else
              curl -sS -w '\nHTTP %{http_code}\n' -X "$m" -H "X-API-Key: $KEY" -H "Accept: application/json" "$url" | head -c 8000
            fi
            echo
          done <<< "$CALLS"
