name: IONOS API call

on:
  workflow_dispatch:
    inputs:
      api_key:
        description: "IONOS API key (prefix.secret)"
        required: true
        type: string
      calls:
        description: "One call per line: METHOD PATH-or-URL [JSON body]"
        required: true
        type: string

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call IONOS API
        env:
          KEY: ${{ inputs.api_key }}
          CALLS: ${{ inputs.calls }}
        run: |
          echo "::add-mask::$KEY"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            m=$(echo "$line" | awk '{print $1}'); p=$(echo "$line" | awk '{print $2}'); b=$(echo "$line" | cut -d' ' -f3-)
            case "$p" in http*) url="$p";; *) url="https://api.hosting.ionos.com$p";; esac
            echo "=================== $m $url"
            if [ -n "$b" ] && [ "$b" != "$line" ] && [ "$b" != "$p" ]; then
              curl -sSL -w '\nHTTP %{http_code}\n' -X "$m" -H "X-API-Key: $KEY" -H "Accept: application/json" -H "Content-Type: application/json" -d "$b" "$url" | head -c 8000
            else
              curl -sSL -w '\nHTTP %{http_code}\n' -X "$m" -H "X-API-Key: $KEY" -H "Accept: application/json" "$url" | grep -oE 'https?://[^"'"'"' <>]*(openapi|swagger|api-docs|\.json|\.yaml)[^"'"'"' <>]*|.{0,0}' | sort -u | head -40; echo "(body shown filtered for spec links)"; curl -sSL -X "$m" -H "X-API-Key: $KEY" -H "Accept: application/json" "$url" | head -c 3000
            fi
            echo
          done <<< "$CALLS"
